# 日本語の検出語彙（cue words）。
# ここを書き換えるだけで、コードを触らずに検閲の「引っかけ語」を調整できます。
# 書式: 「キー名:」の下に「  - 値」を並べるだけ。日本語はそのまま書けばOK。
# 大文字小文字は無視して照合されます。

# actionCues: 「誰かが“行動した”」ことを示す表現。
#   例:「Xと言った」「Yと報告」。事実に無い行動を作り出す捏造の検出に使う。
actionCues:
  - と言った
  - と言っている
  - が言う通り
  - の指摘
  - と主張
  - が反応
  - に投票
  - と報告
  - が認めた
  - の発言

# stanceCues: はっきりした立場・結論を示す言い回し。
#   「ちゃんと意見を述べているか」の判定に使う。
stanceCues:
  - と思います
  - だと思う
  - 疑い
  - 信頼
  - に投票
  - を推し
  - 提案します
  - 結論は
  - おすすめ
  - に決め
  - を選びます

# fillerCues: 中身のない先送り・様子見の言い回し。
#   前進が必要な場面でこれだけだと「埋め草」として弾く。
fillerCues:
  - 様子見
  - 保留
  - なんとも言えない
  - もう少し様子
  - 話を聞いてから
  - 今は動かない
  - 出方を見
  - 時間が解決

# substanceCues: 前向きで具体的な一手を示す言葉（提案・基準・問い）。
#   「fillerが無い」だけでなく「積極的な中身がある」ことを要求するために使う。
substanceCues:
  - 提案
  - 基準
  - 条件
  - 決めましょう
  - 質問
  - 聞きたい
  - 方針
  - 先に決め
  - 整理し
  - やるべき
  - やりましょう
