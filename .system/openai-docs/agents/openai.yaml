interface:
  display_name: "OpenAI Docs"
  short_description: "OpenAI docs、Codex知識、モデル移行を参照"
  icon_small: "./assets/openai-small.svg"
  icon_large: "./assets/openai.png"
  default_prompt: "$openai-docs を使って、公式docs lookup、Codex自体やCodex surfacesの質問、モデル選定、モデル移行、prompt-upgrade作業を行ってください。"

dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "OpenAI Developer Docs MCPサーバー"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
